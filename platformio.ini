; Eigene Firmware fuer das TRMNL OG (ESP32-C3, 7,5" 800x480, 1 Bit)
; Holt Kalender, Aufgaben und Wetter selbst, ohne eigenen Server.

[platformio]
default_envs = trmnl_og

[env:trmnl_og]
platform = espressif32
framework = arduino
board = esp32-c3-devkitc-02
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files = data/x509_crt_bundle.bin
monitor_speed = 115200
upload_speed = 921600
build_type = release
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
  -D EIGEN_FIRMWARE_VERSION=\"0.2.2\"
  -I lib/render/src
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  https://github.com/bitbank2/bb_epaper.git#bfd1b4dc69afc534aa08c33ca7ae5ce1afa1c771
  ricmoo/QRCode@0.0.1
